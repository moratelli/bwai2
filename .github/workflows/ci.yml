name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v7.1.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Set up uv
        # astral-sh/setup-uv v10.3.2
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node.js
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: make setup

      - name: Run project checks
        run: make check

  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Chromium
        run: frontend/node_modules/.bin/playwright install --with-deps chromium

      - name: Validate Compose configuration
        run: |
          docker compose version
          docker compose config

      - name: Build and start the stack
        env:
          GEMINI_API_KEY: ""
          TEST_SUMMARIZER_ENABLED: "true"
        run: docker compose up --build --detach --wait --wait-timeout 240

      - name: Run end-to-end smoke test
        run: ./scripts/smoke_test.sh

      - name: Check concurrent API requests
        run: |
          docker compose cp scripts/generate_sample_pdf.py \
            api:/app/generate_sample_pdf.py
          docker compose cp scripts/concurrency_smoke_test.py \
            api:/app/concurrency_smoke_test.py
          docker compose exec -T --env APP_URL=http://127.0.0.1:8000 \
            api python /app/concurrency_smoke_test.py

      - name: Run browser end-to-end test
        run: |
          python3 scripts/generate_sample_pdf.py .tmp/playwright/sample.pdf
          npm run test:e2e --prefix frontend

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans
