name: Publish images

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.component }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
      IMAGE_REVISION: ${{ github.event.workflow_run.head_sha }}
    strategy:
      matrix:
        include:
          - component: backend
            context: ./backend
            image: ghcr.io/${{ github.repository }}-backend
          - component: frontend
            context: ./frontend
            image: ghcr.io/${{ github.repository }}-frontend
    steps:
      - name: Check out verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.4.1
        uses: >-
          docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        # docker/login-action v4.7.0
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        # docker/build-push-action v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          push: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          tags: |
            ${{ matrix.image }}:sha-${{ github.event.workflow_run.head_sha }}
            ${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}
            org.opencontainers.image.revision=${{ env.IMAGE_REVISION }}
